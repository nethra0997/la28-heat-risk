[project]
name = "la28-heat-risk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
