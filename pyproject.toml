[project]
name = "la28-heat-risk"
version = "0.1.0"
description = "Heat-illness risk scoring (WBGT) for every LA28 Olympic venue and session"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rasterio>=1.4",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "ollama>=0.4",
    "anthropic>=0.40",
    "streamlit>=1.40",
    "pydeck>=0.9",
    "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "heatrisk", "ai"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
