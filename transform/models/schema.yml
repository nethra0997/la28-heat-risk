version: 2

# Descriptions and data tests for each model. `dbt build` runs every test right after
# the table it checks is built; if a test fails, the tables that depend on it are skipped.

models:
  - name: stg_venues
    description: The 49 schedule venue labels with coordinates, exposure and the loc_id join key.
    columns:
      - name: venue_label
        data_tests: [unique, not_null]
      - name: lat
        data_tests: [not_null]
      - name: exposure
        data_tests:
          - accepted_values:
              arguments:
                values: [outdoor, covered, indoor]

  - name: stg_weather_hourly
    description: Bronze hourly weather with tidy names and LA local time.
    columns:
      - name: loc_id
        data_tests:
          - not_null
          - relationships:          # every weather place must be a known venue location
              arguments:
                to: ref('stg_venues')
                field: loc_id
      - name: temp_c
        data_tests:
          - in_range:
              arguments: {min_value: -10, max_value: 55}
      - name: rh_pct
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: stg_schedule_sessions
    description: One row per session from the LA28 schedule PDF, with start/end as timestamps.
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [scheduled, tbd, contingency]
      - name: medal
        data_tests:
          - accepted_values:
              arguments:
                values: [gold, bronze]

  - name: stg_nws_forecast
    description: NWS hourly forecast converted to °C and m/s.
    columns:
      - name: temp_c
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -30, max_value: 55}

  - name: stg_aq_daily
    description: One row per venue, monitor, pollutant and day (several readings per day collapsed to the max).
    columns:
      - name: aqi
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 500}

  - name: stg_tract_vulnerability
    description: Census tracts near venues with CDC/ATSDR SVI 2022 scores and population shares.
    columns:
      - name: geoid
        data_tests: [unique, not_null]
      - name: svi_overall_pctile
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}

  - name: stg_landsat_lst
    description: Landsat land surface temperature per venue and clear scene (partial scenes dropped).
    columns:
      - name: lst_mean_500m_c
        data_tests: [not_null]

  - name: slv_weather_wbgt
    description: Hourly Liljegren WBGT (sun and shade) for every venue location and baseline hour.
    columns:
      - name: wbgt_sun_c
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -5, max_value: 40}
      - name: wbgt_shade_c
        data_tests: [not_null]

seeds:
  - name: wbgt_flag_thresholds
    description: US Army TB MED 507 heat flags, WBGT bands in °C and °F.
    columns:
      - name: flag
        data_tests: [unique, not_null]
