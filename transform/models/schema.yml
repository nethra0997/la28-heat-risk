version: 2

# Descriptions and data tests for each model. `dbt build` runs every test right after
# the table it checks is built; if a test fails, the tables that depend on it are skipped.

models:
  - name: stg_venues
    description: The 49 schedule venue labels with coordinates, exposure and the loc_id join key.
    columns:
      - name: venue_label
        data_tests: [unique, not_null]
      - name: lat
        data_tests: [not_null]
      - name: exposure
        data_tests:
          - accepted_values:
              arguments:
                values: [outdoor, covered, indoor]

  - name: stg_weather_hourly
    description: Bronze hourly weather with tidy names and LA local time.
    columns:
      - name: loc_id
        data_tests:
          - not_null
          - relationships:          # every weather place must be a known venue location
              arguments:
                to: ref('stg_venues')
                field: loc_id
      - name: temp_c
        data_tests:
          - in_range:
              arguments: {min_value: -10, max_value: 55}
      - name: rh_pct
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: stg_schedule_sessions
    description: One row per session from the LA28 schedule PDF, with start/end as timestamps.
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [scheduled, tbd, contingency]
      - name: medal
        data_tests:
          - accepted_values:
              arguments:
                values: [gold, bronze]

  - name: stg_nws_forecast
    description: NWS hourly forecast converted to °C and m/s.
    columns:
      - name: temp_c
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -30, max_value: 55}

  - name: stg_aq_daily
    description: One row per venue, monitor, pollutant and day (several readings per day collapsed to the max).
    columns:
      - name: aqi
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 500}

  - name: stg_tract_vulnerability
    description: Census tracts near venues with CDC/ATSDR SVI 2022 scores and population shares.
    columns:
      - name: geoid
        data_tests: [unique, not_null]
      - name: svi_overall_pctile
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}

  - name: stg_landsat_lst
    description: Landsat land surface temperature per venue and clear scene (partial scenes dropped).
    columns:
      - name: lst_mean_500m_c
        data_tests: [not_null]

  - name: slv_weather_wbgt
    description: Hourly Liljegren WBGT (sun and shade) for every venue location and baseline hour.
    columns:
      - name: wbgt_sun_c
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -5, max_value: 40}
      - name: wbgt_shade_c
        data_tests: [not_null]

  - name: slv_sessions
    description: Scheduled and TBD sessions joined to venue attributes; is_scorable = known venue and start time.
    columns:
      - name: session_id
        data_tests: [unique, not_null]

  - name: slv_session_analog_hours
    description: For each scorable session, the matching hours (same clock time, date +/- 3 days) in every baseline year.
    columns:
      - name: session_id
        data_tests:
          - relationships:
              arguments:
                to: ref('slv_sessions')
                field: session_id

  - name: slv_venue_air_quality
    description: Summer ozone and PM2.5 per venue, using the nearest reporting monitor each day.
    columns:
      - name: venue_id
        data_tests: [unique, not_null]

  - name: slv_venue_community
    description: Population-weighted vulnerability of the tracts within 3 km of each California venue.
    columns:
      - name: venue_id
        data_tests: [unique, not_null]

  - name: slv_venue_surface_heat
    description: Median summer land surface temperature and heat-island anomaly per venue (Landsat).
    columns:
      - name: venue_id
        data_tests: [unique, not_null]

  - name: slv_forecast_wbgt
    description: Forecast WBGT per place and hour; sunlight estimated from the forecast's sky wording.
    columns:
      - name: wbgt_sun_c
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: -10, max_value: 45}

  - name: gold_session_heat
    description: Heat climatology per session across ~77 analog days (median, p90, max WBGT; flag probabilities).
    columns:
      - name: session_id
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('slv_sessions')
                field: session_id

  - name: gold_session_risk
    description: >
      The headline table. One row per session with a 0-100 risk score combining athlete heat,
      spectator arrival heat, community vulnerability, surface heat and air quality, using the
      weights in seeds/risk_weights.csv. Null when the session has no heat estimate.
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: risk_score
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: gold_venue_summary
    description: One row per venue for the map and the AI briefs.
    columns:
      - name: venue_id
        data_tests: [unique, not_null]

  - name: gold_venue_forecast
    description: Daily forecast peak WBGT per venue for the next ~7 days, against its late-July baseline.

seeds:
  - name: wbgt_flag_thresholds
    description: US Army TB MED 507 heat flags, WBGT bands in °C and °F.
    columns:
      - name: flag
        data_tests: [unique, not_null]
